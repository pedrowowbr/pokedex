<ion-header>
  <ion-toolbar>
    <ion-title>Pokédex</ion-title>
    <ion-buttons slot="end">
      <ion-button routerLink="/favorites">
        <ion-icon name="heart" slot="icon-only"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content>
  <div *ngIf="isLoading()" class="spinner-wrapper">
    <ion-spinner></ion-spinner>
  </div>

  <ion-grid *ngIf="!isLoading()">
    <ion-row>
      <ion-col size="6" size-md="4" size-lg="3" *ngFor="let pokemon of pokemons()">
        <ion-card (click)="goToDetails(pokemon)" button>
          <img [src]="pokemon.sprites.other['official-artwork'].front_default" [alt]="pokemon.name" />
          <ion-card-header>
            <ion-card-title class="pokemon-name">
              {{ pokemon.name }}
              <ion-icon
                [name]="favoritesService.isFavorite(pokemon.id) ? 'heart' : 'heart-outline'"
                (click)="toggleFavorite(pokemon, $event)"
              ></ion-icon>
            </ion-card-title>
          </ion-card-header>
        </ion-card>
      </ion-col>
    </ion-row>
  </ion-grid>
</ion-content>

<ion-footer>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-button (click)="previousPage()" [disabled]="currentPage() === 1 || isLoading()">Anterior</ion-button>
    </ion-buttons>
    <ion-title size="small">Página {{ currentPage() }}</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="nextPage()" [disabled]="isLoading()">Próxima</ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-footer>
